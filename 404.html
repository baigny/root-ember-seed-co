<!-- Standalone 404 page. GitHub Pages serves this (with HTTP 404) for
     any path with no matching file — e.g. a typo'd or invalid URL.
     Deliberately NOT a copy of index.html: this only needs to render
     a single static message, so it carries its own light-weight
     styling using the same brand tokens/fonts as the main site.
     Trade-off: typing or refreshing a valid deep link like /services
     directly will land here too, since there's no real router — only
     in-app nav clicks (index.html's JS) reach those pages correctly. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Anzacs Seed Co.</title>
<meta name="robots" content="noindex">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --re-bg:#14120f;
  --re-text:#f3ece1; --re-text-muted:#b7ac99;
  --re-rust:#c1440e;
  --re-lime:#c4f135; --re-lime-dark:#9fc72a;
  --re-font-display:"Fraunces",Georgia,serif; --re-font-body:"Space Grotesk","Segoe UI",sans-serif;
}
html,body{height:100%;overflow-x:hidden;}
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle at 85% 10%,rgba(193,68,14,.28),transparent 45%),radial-gradient(circle at 8% 90%,rgba(196,241,53,.12),transparent 40%),var(--re-bg);
  color:var(--re-text);font-family:var(--re-font-body);text-align:center;padding:2rem;
}
h1,h2{font-family:var(--re-font-display);font-weight:700;}
.brand-mark{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;background:var(--re-rust);color:#fff;border-radius:50%;font-size:1.2rem;margin-bottom:1.5rem;}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--re-lime);}
h2{font-size:clamp(1.6rem,4vw,2.2rem);margin:.75rem 0 1rem;}
p{color:var(--re-text-muted);max-width:420px;margin:0 auto 1.75rem;}
.btn-home{display:inline-flex;align-items:center;gap:.5rem;background:var(--re-lime);color:#14120f;font-weight:600;border-radius:999px;padding:.65rem 1.5rem;text-decoration:none;}
.btn-home:hover{background:var(--re-lime-dark);color:#14120f;}
</style>
</head>
<script>
  /* Deep links (e.g. /root-ember-seed-co/products) have no matching
     file, so GitHub Pages lands here. If it's a real in-app route,
     stash the path and bounce to index.html, which restores it and
     shows the right section. Only unknown routes fall through to the
     message below. */
  var KNOWN = ['home', 'about', 'services', 'products', 'contact'];
  var segs = location.pathname.split('/').filter(Boolean);
  var last = segs[segs.length - 1];
  if (KNOWN.indexOf(last) !== -1) {
    sessionStorage.setItem('re-redirect-path', location.pathname);
    location.replace('/root-ember-seed-co/');
  }
</script>
<body>
  <div>
    <span class="brand-mark"><i class="bi bi-flower2"></i></span>
    <p class="eyebrow mb-0"><i class="bi bi-exclamation-triangle me-1"></i> 404</p>
    <h2>This bed hasn't been planted.</h2>
    <p>The page you're looking for doesn't exist.</p>
    <a class="btn-home" href="/root-ember-seed-co/">Back to Home <i class="bi bi-arrow-right"></i></a>
  </div>
</body>
</html>
